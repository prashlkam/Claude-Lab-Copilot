[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labcopilot"
version = "0.1.0"
description = "A study copilot for hands-on labs: turns a lab page into an explained step-by-step guide and helps you debug while you do the steps yourself."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
labcopilot = "labcopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
